# Two kinds of test live in this repository, and they are not run together.
#
#   pytest -q            the infrastructure and your own cases -- green at all times
#   pytest -q -m gate    the session's checklist -- RED until you have done the task
#
# A "gate" test does not check that the code works. It checks that YOU did the
# task: five hand-written cases per method, and a domain extension of the size
# the exercise asks for. Keeping them out of the default run is what lets
# `pytest -q` stay a statement about the software.
[pytest]
markers =
    gate: the session's task checklist -- red until the task is done
addopts = -m "not gate"
testpaths = tests
