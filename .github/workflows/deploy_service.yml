name: Deploy the Pizza API

# The service behind https://wse-research.org/pizza-api is built from common/.
# Until now every change to it needed a manual call to the microservice-updater
# from inside the university network, which is why the deployed version was
# months behind the code. This workflow makes that call, and then proves from
# outside that the new version is really the one answering.
#
# The updater action is idempotent: it asks the updater whether the service id
# already exists and registers it when it does not, updates it when it does.
# So there is no separate registration workflow -- the first successful run of
# this one is the registration.

on:
  push:
    branches: [main]
    paths:
      - 'common/**'
      - 'service_config/**'
      - '.github/workflows/deploy_service.yml'
  workflow_dispatch:

env:
  # The id the updater action derives from the clone URL.
  SERVICE_ID: wse-research-langgraph-examples

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A missing secret otherwise surfaces as an opaque failure inside the
      # updater action. This reports presence only -- never a value.
      - name: Check that the deployment secrets are set
        env:
          UPDATER_HOST: ${{ secrets.UPDATER_HOST }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          fail=0
          if [ -n "$UPDATER_HOST" ]; then echo "UPDATER_HOST: set"; else echo "UPDATER_HOST: MISSING"; fail=1; fi
          if [ -n "$API_KEY" ];      then echo "API_KEY: set";      else echo "API_KEY: MISSING";      fail=1; fi
          exit $fail

      - name: Register or update the service
        uses: WSE-research/docker-service-updater@v0.2.1
        with:
          updater_host: ${{ secrets.UPDATER_HOST }}
          api_key: ${{ secrets.API_KEY }}
          config_file: service_config/service_config.json
          setup_path: service_config

      # An update restarts the container, and the updater's own state is a poor
      # readiness signal for that: it still says RUNNING from the *previous*
      # rollout while the new container is starting, so a check that trusts it
      # runs straight into a 502. (That is exactly how the first run of this
      # workflow after the cut-over failed: 12/13, the one failure a transient
      # 502 on the first request.)
      #
      # So readiness is the verification itself, retried. The container's own
      # port cannot be used for this -- 40216 is not reachable from outside the
      # university network, because the host firewall exposes only some ports;
      # ten other proxied services are in the same position and answer fine
      # through the reverse proxy. The public URL is both the only address
      # checkable from here and the address the course material uses, so it is
      # the right thing to gate on.
      - name: Verify the public URL, once the rollout has settled
        env:
          UPDATER_HOST: ${{ secrets.UPDATER_HOST }}
        run: |
          for attempt in $(seq 1 30); do
            sleep 10
            if bash common/verify-pizza-api.sh > verify.log 2>&1; then
              cat verify.log
              echo "verified on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: not ready yet ($(tail -1 verify.log))"
          done
          echo "--- the deployment did not verify within five minutes ---"
          cat verify.log
          echo "--- what the updater reports ---"
          curl -sk -m 30 "$UPDATER_HOST/service/$SERVICE_ID" || true
          exit 1
